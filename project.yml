# XcodeGen spec. Run `xcodegen generate` to create RpTv.xcodeproj (not checked in).
name: RpTv
options:
  bundleIdPrefix: app.rptv
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  RpTvKit:
    path: Packages/RpTvKit
  # Brings in Packages/FFmpeg (built from the Vendor/FFmpeg submodule by Scripts/build-ffmpeg.sh). The app
  # doesn't reference FFmpeg itself: Xcode loses track of a local package listed here and also depended on by
  # another one, and only StreamBridge may call FFmpeg (see CLAUDE.md).
  StreamBridge:
    path: Packages/StreamBridge
  Nuke:
    url: https://github.com/kean/Nuke
    from: "13.2.0"
  # Official VideoLAN binary target (dynamic VLCKit.framework, LGPL-2.1). Only 4.x alpha builds exist so far,
  # so the version is pinned exactly. See THIRD_PARTY_NOTICES.md.
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: "4.0.0-a25"

targets:
  RpTv:
    type: application
    platform: iOS
    sources:
      - App
    # The team ID comes from Config/Local.xcconfig (not checked in), so regenerating keeps it.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: RpTvKit
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: VLCKit
      # A dynamic framework (see its Package.swift), so it has to be embedded.
      - package: StreamBridge
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rptv.RpTv
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RpTv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # IPTV servers are user-supplied and very often plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: RpTv connects to IPTV servers on your local network when you add one.
        NSFaceIDUsageDescription: RpTv uses Face ID to open categories locked by parental controls.

  RpTvUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: RpTv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rptv.RpTvUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  RpTv:
    build:
      targets:
        RpTv: all
    test:
      targets:
        - package: RpTvKit/RpTvKitTests
        - RpTvUITests
    run:
      config: Debug
