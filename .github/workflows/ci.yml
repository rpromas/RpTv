name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Core tests
        run: swift test --package-path Packages/RpTvKit
      # FFmpeg's simulator slice is arm64 only, so leave out the x86_64 a generic simulator build adds.
      - name: Build app
        run: |
          xcodebuild -project RpTv.xcodeproj -scheme RpTv \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
