<!-- App icon source: an old Šilelis portable TV with the Vilnius TV tower as its antenna.
     Rendered to App/Assets.xcassets/AppIcon.appiconset/AppIcon.png (1024×1024, no alpha). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#11543C"/><stop offset="0.55" stop-color="#0A3326"/><stop offset="1" stop-color="#051A13"/>
  </linearGradient>
  <radialGradient id="halo" cx="512" cy="300" r="420" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3FE08C" stop-opacity="0.30"/><stop offset="1" stop-color="#3FE08C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C9C1AE"/><stop offset="0.45" stop-color="#F6F0E2"/><stop offset="1" stop-color="#A9A08C"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7F0DE"/><stop offset="0.7" stop-color="#E4D9BE"/><stop offset="1" stop-color="#CBBD9C"/>
  </linearGradient>
  <radialGradient id="crt" cx="0.45" cy="0.42" r="0.68">
    <stop offset="0" stop-color="#8CF8BE"/><stop offset="0.45" stop-color="#2BC774"/><stop offset="1" stop-color="#08502D"/>
  </radialGradient>
  <linearGradient id="windows" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1E9E5A"/><stop offset="0.45" stop-color="#7BF5B3"/><stop offset="1" stop-color="#178049"/>
  </linearGradient>
  <radialGradient id="knob" cx="0.38" cy="0.32" r="0.8">
    <stop offset="0" stop-color="#FFFBF0"/><stop offset="1" stop-color="#BDAF90"/>
  </radialGradient>
  <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#B9FFD8"/><stop offset="0.4" stop-color="#3FE08C"/><stop offset="1" stop-color="#3FE08C" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#halo)"/>
<g transform="translate(0,20)">

